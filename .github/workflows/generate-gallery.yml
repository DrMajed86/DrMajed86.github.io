name: Update gallery.json

on:
  push:
    paths:
      - "imgs/gallery/**"   # triggers whenever an image is added/removed/renamed

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit gallery.json back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate gallery.json
        run: python3 generate_gallery.py

      - name: Commit updated gallery.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gallery.json
          git diff --cached --quiet || git commit -m "chore: regenerate gallery.json [skip ci]"
          git push
